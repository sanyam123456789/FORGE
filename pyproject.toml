[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "0.1.0"
description = "A lightweight, modular coding-agent harness for LLM-based software engineering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# -----------------------------------------------------------------------
# Runtime dependencies — kept minimal by design.
# Each dependency must be justified before adding.
#
# python-dotenv:  loads .env file into environment at startup.
#                 Zero-config developer convenience; imported lazily.
# google-genai:   official Google Gemini SDK. Gemini is the current
#                 (not permanent) LLM provider. Confined to
#                 forge/providers/gemini.py behind the LLMProvider
#                 interface; imported lazily so tests and non-LLM code
#                 paths do not require it.
#
# Still deliberately absent: agent frameworks, vector stores, databases,
# web frameworks, tokenizer libraries.
# -----------------------------------------------------------------------
dependencies = [
    "python-dotenv>=1.0",
    "google-genai>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]
