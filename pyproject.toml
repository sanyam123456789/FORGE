[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forge"
version = "1.0.0"
description = "A lightweight, modular coding-agent harness for LLM-based software engineering."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

# -----------------------------------------------------------------------
# Runtime dependencies — kept minimal by design.
# Each dependency must be justified before adding.
#
# python-dotenv:      loads .env file into environment at startup.
#                     Zero-config developer convenience; imported lazily.
#
# LLM access needs no SDK: forge/providers/openai_compat.py talks to any
# OpenAI-compatible endpoint (default: OpenCode Go) with urllib from the
# standard library. The FallbackProvider (forge/providers/fallback.py) is
# opt-in and adds no dependency of its own.
#
# Still deliberately absent: agent frameworks, vector stores, databases,
# web frameworks, tokenizer libraries.
# -----------------------------------------------------------------------
dependencies = [
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
forge = "forge.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v --tb=short"

[tool.setuptools.packages.find]
where = ["."]
include = ["forge*"]
